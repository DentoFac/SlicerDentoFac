name: Headless regression tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  syntax-and-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install headless test dependencies
        run: python -m pip install --upgrade pip pytest numpy requests PyGithub
      - name: Compile extension Python
        run: python -m compileall -q DentoFac Segmentation
      - name: Run reference-proven headless suites
        env:
          PYTHONPATH: Segmentation
        run: >-
          python -m pytest -q
          Segmentation/Testing/PythonDependencyCheckerTestCase.py
          Segmentation/Testing/ExportManagerTestCase.py
          Segmentation/Testing/SegmentationResultProcessorTestCase.py
